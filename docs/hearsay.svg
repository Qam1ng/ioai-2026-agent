<svg viewBox="0 0 900 1010" width="900" height="1010" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="900" height="1010" fill="#ffffff"/>
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
<path d="M0 1 L9 5 L0 9 z" fill="#9a9a94"/>
</marker>
</defs>

<text x="40" y="46" font-size="22" fill="#1a1a18">HearSay</text>
<text x="40" y="70" font-size="13.5" fill="#6b6b66">Three solvers, one board, and a harness that owns every number</text>

<rect x="40" y="92" width="180" height="26" rx="13" fill="#f1efe8"/>
<text x="56" y="110" font-size="12.5" fill="#5f5e5a">Claude Code session</text>
<rect x="232" y="92" width="176" height="26" rx="13" fill="#ffffff" stroke="#d3d1c7"/>
<text x="248" y="110" font-size="12.5" fill="#5f5e5a">deterministic, no LLM</text>

<text x="40" y="160" font-size="12.5" fill="#888882">ONE COMMAND</text>
<rect x="40" y="172" width="820" height="46" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<text x="60" y="201" font-size="14" fill="#2c2c2a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">python -m native.main --slug &lt;competition&gt; --solvers 3</text>

<text x="40" y="256" font-size="12.5" fill="#888882">BOOTSTRAP — before any agent starts</text>
<g font-size="13">
<rect x="40" y="268" width="196" height="62" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<text x="138" y="294" text-anchor="middle" fill="#2c2c2a">read the task</text>
<text x="138" y="314" font-size="11.5" text-anchor="middle" fill="#7a7a74">once, not four times</text>
<rect x="248" y="268" width="196" height="62" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<text x="346" y="294" text-anchor="middle" fill="#2c2c2a">fetch the data</text>
<text x="346" y="314" font-size="11.5" text-anchor="middle" fill="#7a7a74">verified, not assumed</text>
<rect x="456" y="268" width="196" height="62" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<text x="554" y="294" text-anchor="middle" fill="#2c2c2a">reconnoitre it</text>
<text x="554" y="314" font-size="11.5" text-anchor="middle" fill="#7a7a74">leaks · duplicates · format</text>
<rect x="664" y="268" width="196" height="62" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<text x="762" y="294" text-anchor="middle" fill="#2c2c2a">CSV or kernel?</text>
<text x="762" y="314" font-size="11.5" text-anchor="middle" fill="#7a7a74">ask, do not guess</text>
</g>

<text x="40" y="374" font-size="12.5" fill="#888882">FOUR SESSIONS IN PARALLEL — preset prompt kept, full toolset, nothing removed</text>
<g>
<rect x="40" y="386" width="196" height="118" rx="10" fill="#f1efe8" stroke="#b4b2a9"/>
<text x="138" y="412" font-size="14.5" text-anchor="middle" fill="#1a1a18">evaluator</text>
<text x="138" y="437" font-size="12" text-anchor="middle" fill="#5f5e5a">compiles the ruler:</text>
<text x="138" y="455" font-size="12" text-anchor="middle" fill="#5f5e5a">metric.py + folds.json</text>
<text x="138" y="479" font-size="12" text-anchor="middle" fill="#5f5e5a">then gates submission</text>
<text x="138" y="496" font-size="11.5" text-anchor="middle" fill="#8b8a84">never touches modelling</text>

<rect x="248" y="386" width="612" height="118" rx="10" fill="#f1efe8" stroke="#b4b2a9"/>
<text x="554" y="412" font-size="14.5" text-anchor="middle" fill="#1a1a18">solver_a    solver_b    solver_c</text>
<text x="554" y="440" font-size="12.5" text-anchor="middle" fill="#5f5e5a">Nobody assigns them an approach. They read the task, decide where</text>
<text x="554" y="459" font-size="12.5" text-anchor="middle" fill="#5f5e5a">they think it is won, and claim that angle on the board.</text>
<text x="554" y="486" font-size="12" text-anchor="middle" fill="#8b8a84">identical contracts  ·  cannot see each other's scores  ·  no submit tool</text>
</g>

<line x1="138" y1="506" x2="138" y2="534" stroke="#b4b2a9" stroke-dasharray="4 3"/>
<line x1="380" y1="506" x2="380" y2="534" stroke="#b4b2a9" stroke-dasharray="4 3"/>
<line x1="554" y1="506" x2="554" y2="534" stroke="#b4b2a9" stroke-dasharray="4 3"/>
<line x1="728" y1="506" x2="728" y2="534" stroke="#b4b2a9" stroke-dasharray="4 3"/>

<rect x="40" y="536" width="820" height="92" rx="10" fill="#ffffff" stroke="#888882" stroke-width="1.5"/>
<text x="450" y="564" font-size="15" text-anchor="middle" fill="#1a1a18">the facts board</text>
<text x="450" y="586" font-size="12.5" text-anchor="middle" fill="#5f5e5a">append-only file · delivered every round · no LLM anywhere near it</text>
<text x="450" y="609" font-size="12.5" text-anchor="middle" fill="#5f5e5a">
  <tspan font-family="ui-monospace, monospace">claim</tspan> the angle you took ·
  <tspan font-family="ui-monospace, monospace">data format failure env</tspan> what you learned ·
  <tspan font-family="ui-monospace, monospace">result</tspan> a score, harness only
</text>

<text x="40" y="672" font-size="12.5" fill="#888882">SCORING — the agent that made a candidate never says what it is worth</text>
<g font-size="13">
<rect x="40" y="684" width="256" height="58" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<text x="168" y="708" text-anchor="middle" fill="#2c2c2a">evaluate.py</text>
<text x="168" y="728" font-size="11.5" text-anchor="middle" fill="#7a7a74">reads out/oof.npy on the frozen split</text>
<rect x="308" y="684" width="256" height="58" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<text x="436" y="708" text-anchor="middle" fill="#2c2c2a">promote.py</text>
<text x="436" y="728" font-size="11.5" text-anchor="middle" fill="#7a7a74">no-regression gate → last-known-good</text>
<rect x="576" y="684" width="284" height="58" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<text x="718" y="708" text-anchor="middle" fill="#2c2c2a">integrity.py</text>
<text x="718" y="728" font-size="11.5" text-anchor="middle" fill="#7a7a74">seals the file that produced the score</text>
</g>

<text x="40" y="786" font-size="12.5" fill="#888882">SUBMISSION — four gates, and none of them can refuse forever</text>
<g font-size="13.5">
<rect x="40" y="798" width="820" height="40" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<text x="62" y="823" fill="#2c2c2a">1  the ruler exists and enough candidates carry a computed score</text>
<text x="840" y="823" font-size="11.5" text-anchor="end" fill="#8b8a84">past 55% → send the best there is</text>

<rect x="40" y="846" width="820" height="40" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<text x="62" y="871" fill="#2c2c2a">2  quota and throttling; must beat what was already sent</text>

<rect x="40" y="894" width="820" height="40" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<text x="62" y="919" fill="#2c2c2a">3  mechanical evidence — format, provenance, order dependence</text>
<text x="840" y="919" font-size="11.5" text-anchor="end" fill="#8b8a84">evidence for gate 4, not a verdict</text>

<rect x="40" y="942" width="820" height="40" rx="10" fill="#f1efe8" stroke="#888882" stroke-width="1.5"/>
<text x="62" y="967" fill="#1a1a18">4  the evaluator decides — approve, hold, or reject</text>
<text x="840" y="967" font-size="11.5" text-anchor="end" fill="#8b8a84">90s silence → gate 3 · hold expires at 55%</text>
</g>
<line x1="450" y1="838" x2="450" y2="844" stroke="#9a9a94" marker-end="url(#ar)"/>
<line x1="450" y1="886" x2="450" y2="892" stroke="#9a9a94" marker-end="url(#ar)"/>
<line x1="450" y1="934" x2="450" y2="940" stroke="#9a9a94" marker-end="url(#ar)"/>

<line x1="880" y1="386" x2="880" y2="982" stroke="#d3d1c7"/>
<text x="872" y="600" font-size="11.5" text-anchor="end" fill="#8b8a84" transform="rotate(-90 872 600)">
  watching throughout: drift · stalls · revival · leaderboard calibration
</text>
</svg>
