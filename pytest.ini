[pytest]
# `workspace/` holds live run artifacts — agents write scratch scripts there and
# pytest collected one (t3run8's noisy_test.py), so a full-suite run died in
# collection rather than on any real test.
testpaths = tests search_system/tests
norecursedirs = workspace .git __pycache__ *.egg-info .venv venv data
# search_system is a self-contained subproject; its tests import
# `ioai_agent_system`, which only resolves with search_system on the path.
pythonpath = . search_system
